<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Starbucks Food Order App</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Food Order">
    <meta name="theme-color" content="#1B365D">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="shortcut icon" href="logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        navyPrimary: '#1B365D',
                        navyDark: '#0A192F',
                        bgSoft: '#F1F5F9',
                        cardWhite: '#FFFFFF',
                        pulseBlue: '#38BDF8'
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #e2e8f0; touch-action: manipulation; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .btn-press { position: relative; overflow: hidden; }
        .btn-press:active { transform: scale(0.95); transition: transform 0.12s ease; }
        .app-container { max-width: 430px; margin: 0 auto; min-height: 100vh; background-color: #F8FAFC; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); position: relative; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        .card-enter { animation: slideUp 0.38s ease forwards; opacity: 0; }
        .slide-track-glow { border: 2px solid rgba(56, 189, 248, 0.5); box-shadow: 0 0 12px rgba(56, 189, 248, 0.3); }
    </style>
</head>
<body class="font-sans text-slate-800 text-sm">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 bg-navyDark z-50 flex items-center justify-center p-4">
        <div class="app-container w-full bg-slate-50 flex flex-col justify-between p-6 text-center text-slate-800 relative overflow-hidden shadow-2xl">
            <div class="bg-navyPrimary text-white -mx-6 -mt-6 p-6 rounded-b-3xl shadow-md">
                <h1 class="text-sm font-extrabold tracking-widest uppercase">INDEPENDENCE HOTEL</h1>
                <p class="text-slate-300 text-xs mt-0.5 font-medium">F&B - SMART ORDER PORTAL</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-3.5 text-left my-auto shadow-lg">
                <h3 class="font-bold text-navyPrimary text-xs uppercase tracking-wider">Staff Login</h3>
                <div>
                    <label class="text-[11px] text-slate-500 font-bold uppercase mb-1 block">Full Name *</label>
                    <input type="text" id="loginFullName" placeholder="Enter your full name" class="w-full px-3 py-2.5 bg-slate-50 border rounded-xl text-sm font-semibold">
                </div>
                <div>
                    <label class="text-[11px] text-slate-500 font-bold uppercase mb-1 block">Phone Number *</label>
                    <input type="tel" id="loginPhone" placeholder="Enter your phone number" class="w-full px-3 py-2.5 bg-slate-50 border rounded-xl text-sm font-semibold">
                </div>
                <button type="button" onclick="submitLogin()" class="w-full bg-navyPrimary text-white font-bold py-3 rounded-xl shadow-md text-sm mt-1">LOGIN TO SYSTEM</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div class="app-container flex flex-col justify-between pb-28">
        <div>
            <!-- Header -->
            <div class="bg-navyPrimary text-center py-4 px-3 shadow-md rounded-b-2xl mb-3">
                <div class="flex justify-between items-center px-2 mb-2">
                    <span id="loggedInUserDisplay" class="text-white text-[11px] font-semibold">Staff</span>
                    <button type="button" onclick="handleLogout()" class="text-slate-300 text-xs font-bold px-2 py-1 rounded bg-white/10">Logout</button>
                </div>
                <h1 class="text-white text-sm font-extrabold tracking-widest uppercase">INDEPENDENCE HOTEL</h1>
                <p class="text-slate-300 text-xs mt-0.5 font-semibold">F&B - SMART ORDER PORTAL</p>
            </div>

            <!-- 24H ORDER HISTORY SECTION -->
            <div class="px-3 mb-3">
                <div class="bg-sky-50 border border-sky-200 p-3 rounded-xl shadow-sm">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-extrabold text-navyPrimary uppercase tracking-wider flex items-center">
                            <i class="fa-solid fa-clock-rotate-left text-sky-500 mr-1.5"></i> 24H Order History & Edit
                        </span>
                        <div class="flex items-center space-x-2">
                            <button type="button" onclick="clearDoNo()" id="newOrderModeBtn" class="hidden text-[10px] text-emerald-600 font-bold bg-emerald-100 px-2 py-0.5 rounded">Switch to New</button>
                            <span id="historyCountBadge" class="bg-sky-200 text-navyPrimary text-[10px] font-bold px-2 py-0.5 rounded-full">0 orders</span>
                        </div>
                    </div>
                    <div id="historyListContainer" class="space-y-1.5 max-h-36 overflow-y-auto text-xs">
                        <p class="text-slate-400 text-center py-2 italic">No recent orders in the last 24 hours.</p>
                    </div>
                </div>
            </div>

            <form id="orderForm" class="px-3 space-y-3">
                <!-- Hidden DO Number Field -->
                <input type="hidden" id="doNoInput" value="">

                <div class="bg-white p-3.5 rounded-xl shadow-sm border space-y-2.5">
                    <div>
                        <label class="text-[11px] text-slate-500 font-bold uppercase mb-0.5 block">SELECT BRANCH *</label>
                        <select id="branch" required class="w-full p-2 bg-slate-50 border rounded-lg text-sm font-semibold">
                            <option value="">Select Branch...</option>
                            <option value="STARBUCKS 1">STARBUCKS 1</option>
                            <option value="STARBUCKS 2">STARBUCKS 2</option>
                            <option value="STARBUCKS 3">STARBUCKS 3</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="text-[11px] text-slate-500 font-bold uppercase mb-0.5 block">Order Date *</label>
                            <input type="date" id="orderDate" required class="w-full p-2 bg-slate-50 border rounded-lg text-sm font-semibold">
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-500 font-bold uppercase mb-0.5 block">Pickup Time *</label>
                            <input type="text" id="pickupTime" list="timeOptions" placeholder="e.g. 05:30 AM" required class="w-full p-2 bg-slate-50 border rounded-lg text-sm font-semibold">
                            <datalist id="timeOptions"></datalist>
                        </div>
                    </div>

                    <div>
                        <label class="text-[11px] text-slate-500 font-bold uppercase mb-0.5 block">Ordered By *</label>
                        <input type="text" id="orderedBy" readonly class="w-full p-2 bg-slate-100 border rounded-lg text-sm font-bold text-navyPrimary">
                    </div>
                </div>

                <div id="menuContainer" class="space-y-2.5"></div>
            </form>
        </div>
    </div>

    <!-- Sticky Footer -->
    <div class="fixed bottom-0 left-0 w-full bg-transparent p-3 z-20 pointer-events-none">
        <div class="max-w-[430px] mx-auto bg-white/95 backdrop-blur-md border p-3.5 shadow-2xl rounded-2xl pointer-events-auto flex items-center justify-between">
            <div>
                <p class="text-[11px] text-slate-400 font-bold uppercase">Total Quantity</p>
                <p class="text-xl font-black text-navyDark"><span id="totalQtyDisplay">0</span> units</p>
            </div>
            <div class="flex items-center space-x-2">
                <button type="button" id="placeOrderBtn" class="bg-navyPrimary text-white px-4 py-3 rounded-xl text-xs font-bold shadow-md">PLACE ORDER</button>
                <button type="button" id="updateOrderBtn" class="bg-amber-600 text-white px-4 py-3 rounded-xl text-xs font-bold shadow-md hidden">UPDATE ORDER</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
            <h3 id="modalTitle" class="font-extrabold text-sm text-navyPrimary uppercase">CONFIRM ORDER</h3>
            <div id="orderSummaryBox" class="bg-slate-50 p-3.5 rounded-xl border text-left text-xs space-y-2"></div>
            <div id="slideTrack" class="relative bg-slate-50 slide-track-glow h-14 rounded-xl overflow-hidden flex items-center px-1 select-none">
                <div id="slideFill" class="absolute left-0 top-0 bottom-0 bg-sky-400/25 w-0 pointer-events-none"></div>
                <span class="absolute inset-0 flex items-center justify-center text-xs font-extrabold uppercase text-slate-500">Slide to Confirm &rarr;</span>
                <div id="slideThumb" class="absolute left-1 top-1 bottom-1 w-12 bg-navyPrimary rounded-lg flex items-center justify-center text-white cursor-pointer z-10 shadow">
                    <i class="fa-solid fa-angles-right text-xs"></i>
                </div>
            </div>
            <button type="button" id="cancelBtn" class="w-full bg-slate-100 py-3 rounded-xl font-bold text-xs">Cancel</button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-5">
            <h3 id="progressTitle" class="font-extrabold text-sm text-navyPrimary uppercase">Processing...</h3>
            <p id="progressSubtitle" class="text-xs text-sky-600">Please wait...</p>
        </div>
    </div>

    <script>
        function checkAuth() {
            const loggedUser = localStorage.getItem('starbucks_logged_user');
            if (loggedUser) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('loggedInUserDisplay').innerText = loggedUser.split(' (')[0]; 
                document.getElementById('orderedBy').value = loggedUser;
                renderOrderHistory();
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
            }
        }

        function submitLogin() {
            const fullName = document.getElementById('loginFullName').value.trim();
            const phone = document.getElementById('loginPhone').value.trim();
            if (!fullName || !phone) { alert("សូមបញ្ចូលឈ្មោះ និងលេខទូរស័ព្ទ!"); return; }
            localStorage.setItem('starbucks_logged_user', `${fullName} (${phone})`);
            checkAuth();
        }

        function handleLogout() { localStorage.removeItem('starbucks_logged_user'); window.location.reload(); }
        window.addEventListener('DOMContentLoaded', checkAuth);

        // --- CLIENT-SIDE DO GENERATOR (MATCHES SHEET FORMAT) ---
        function generateClientDO(branchName, orderDateStr) {
            const dateObj = orderDateStr ? new Date(orderDateStr) : new Date();
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            const dateStr = `${year}${month}${day}`;

            let storeCode = "STB";
            const b = branchName ? branchName.toUpperCase() : "";
            if (b.includes("STARBUCKS 1")) storeCode = "STB1";
            else if (b.includes("STARBUCKS 2")) storeCode = "STB2";
            else if (b.includes("STARBUCKS 3")) storeCode = "STB3";

            const seqKey = `STB_SEQ_${storeCode}_${dateStr}`;
            let seq = parseInt(localStorage.getItem(seqKey) || "0", 10) + 1;
            localStorage.setItem(seqKey, seq.toString());

            const seqStr = String(seq).padStart(3, '0');
            return `DO-${storeCode}-${dateStr}-${seqStr}`;
        }

        // --- 24H ORDER HISTORY LOGIC ---
        function saveOrderToHistory(orderData) {
            let history = JSON.parse(localStorage.getItem('stb_order_history') || '[]');
            const now = new Date().getTime();
            history = history.filter(item => now - item.timestamp < 86400000);
            
            const existingIndex = history.findIndex(item => item.doNo && item.doNo === orderData.doNo);
            if (existingIndex !== -1) {
                history[existingIndex] = orderData;
            } else {
                history.unshift(orderData);
            }
            localStorage.setItem('stb_order_history', JSON.stringify(history));
            renderOrderHistory();
        }

        function renderOrderHistory() {
            const container = document.getElementById('historyListContainer');
            const badge = document.getElementById('historyCountBadge');
            let history = JSON.parse(localStorage.getItem('stb_order_history') || '[]');
            const now = new Date().getTime();
            history = history.filter(item => now - item.timestamp < 86400000);
            localStorage.setItem('stb_order_history', JSON.stringify(history));

            if (history.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-center py-2 italic">No recent orders in the last 24 hours.</p>`;
                badge.innerText = `0 orders`;
                return;
            }

            badge.innerText = `${history.length} order(s)`;
            let html = '';
            history.forEach((ord, index) => {
                html += `
                    <div class="bg-white p-2 rounded-lg border border-sky-100 flex justify-between items-center shadow-xs">
                        <div>
                            <p class="font-extrabold text-navyPrimary">${ord.doNo} <span class="text-[10px] text-slate-500 font-normal">(${ord.branch})</span></p>
                            <p class="text-[10px] text-slate-500">Date: ${ord.orderDate} | Qty: <span class="font-bold text-sky-600">${ord.totalQty}</span></p>
                        </div>
                        <button type="button" onclick="loadOrderToForm(${index})" class="bg-amber-600 text-white px-2.5 py-1 rounded text-[10px] font-bold">Edit</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.loadOrderToForm = function(index) {
            let history = JSON.parse(localStorage.getItem('stb_order_history') || '[]');
            if (!history[index]) return;
            const ord = history[index];

            document.getElementById('doNoInput').value = ord.doNo || '';
            document.getElementById('branch').value = ord.branch || '';
            document.getElementById('orderDate').value = ord.orderDate || '';
            document.getElementById('pickupTime').value = ord.pickupTime || '';

            bakeryItems.forEach(item => {
                quantities[item.id] = ord[item.id] || 0;
                document.getElementById(`qty-${item.id}`).value = quantities[item.id];
            });
            totalQty = ord.totalQty || 0;
            totalAmount = parseFloat(ord.totalAmount) || 0;
            document.getElementById('totalQtyDisplay').innerText = totalQty;

            document.getElementById('placeOrderBtn').classList.add('hidden');
            document.getElementById('updateOrderBtn').classList.remove('hidden');
            document.getElementById('newOrderModeBtn').classList.remove('hidden');

            alert(`Loaded DO: ${ord.doNo} for updating. Make changes and click UPDATE ORDER!`);
        };

        window.clearDoNo = function() {
            document.getElementById('doNoInput').value = '';
            document.getElementById('placeOrderBtn').classList.remove('hidden');
            document.getElementById('updateOrderBtn').classList.add('hidden');
            document.getElementById('newOrderModeBtn').classList.add('hidden');
            alert("Switched back to New Order mode.");
        };

        const bakeryItems = [
            { id: 'item1', name: 'Egg Salad Wrap',     price: 0, emoji: '🥚' },
            { id: 'item2', name: 'Chicken Salad Wrap', price: 0, emoji: '🍗' },
            { id: 'item3', name: 'Salad Wrapped',      price: 0, emoji: '🥗' },
            { id: 'item4', name: 'Fresh Sandwich',     price: 0, emoji: '🥪' }
        ];

        const menuContainer = document.getElementById('menuContainer');
        const quantities = {};

        bakeryItems.forEach((item) => {
            quantities[item.id] = 0;
            const card = document.createElement('div');
            card.className = "bg-white p-3 rounded-xl shadow-sm border flex justify-between items-center";
            card.innerHTML = `
                <div class="flex items-center space-x-3"><span class="text-xl">${item.emoji}</span><h3 class="font-bold text-sm">${item.name}</h3></div>
                <div class="flex items-center space-x-1.5 bg-slate-50 rounded-lg p-1 border">
                    <button type="button" class="px-2.5 h-7 bg-white rounded text-xs font-bold" onclick="updateQty('${item.id}', -10)">-10</button>
                    <input type="number" id="qty-${item.id}" value="0" min="0" class="w-10 text-center font-bold bg-transparent" oninput="manualInputQty('${item.id}', this.value)">
                    <button type="button" class="px-2.5 h-7 bg-white rounded text-xs font-bold" onclick="updateQty('${item.id}', 10)">+10</button>
                </div>
            `;
            menuContainer.appendChild(card);
        });

        let totalQty = 0, totalAmount = 0;
        window.updateQty = function(id, change) {
            quantities[id] = Math.max(0, quantities[id] + change);
            document.getElementById(`qty-${id}`).value = quantities[id];
            recalcTotal();
        }
        window.manualInputQty = function(id, val) {
            quantities[id] = Math.max(0, parseInt(val) || 0);
            recalcTotal();
        }
        function recalcTotal() {
            totalQty = 0;
            bakeryItems.forEach(item => totalQty += quantities[item.id]);
            document.getElementById('totalQtyDisplay').innerText = totalQty;
        }

        let tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('orderDate').valueAsDate = tomorrow;

        const placeOrderBtn = document.getElementById('placeOrderBtn');
        const updateOrderBtn = document.getElementById('updateOrderBtn');
        const confirmModal = document.getElementById('confirmModal');
        let currentActionType = 'new';

        function triggerConfirm(action) {
            if (totalQty === 0) { alert("Please add at least one item!"); return; }
            if (!document.getElementById('orderForm').checkValidity()) { document.getElementById('orderForm').reportValidity(); return; }

            currentActionType = action;
            document.getElementById('modalTitle').innerText = action === 'update' ? 'CONFIRM ORDER UPDATE' : 'CONFIRM NEW ORDER';
            confirmModal.classList.remove('hidden');
        }

        placeOrderBtn.addEventListener('click', () => triggerConfirm('new'));
        updateOrderBtn.addEventListener('click', () => triggerConfirm('update'));
        document.getElementById('cancelBtn').addEventListener('click', () => confirmModal.classList.add('hidden'));

        // Slide to confirm
        const slideTrack = document.getElementById('slideTrack'), slideThumb = document.getElementById('slideThumb'), slideFill = document.getElementById('slideFill');
        let isDragging = false, startX = 0, trackWidth = 260;
        slideThumb.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let diff = Math.max(0, Math.min(e.clientX - startX, trackWidth));
            slideThumb.style.transform = `translateX(${diff}px)`;
            slideFill.style.width = `${diff + 40}px`;
            if (diff >= trackWidth * 0.75) {
                isDragging = false;
                confirmModal.classList.add('hidden');
                slideThumb.style.transform = `translateX(0px)`;
                slideFill.style.width = `0px`;
                executeOrderSubmission(currentActionType);
            }
        });
        window.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; slideThumb.style.transform = `translateX(0px)`; slideFill.style.width = `0px`; } });

        function executeOrderSubmission(action) {
            document.getElementById('loadingOverlay').classList.remove('hidden');

            let doNo = document.getElementById('doNoInput').value.trim();
            const branch = document.getElementById('branch').value;
            const orderDate = document.getElementById('orderDate').value;
            const pickupTime = document.getElementById('pickupTime').value;

            if (action === 'new' || !doNo) {
                doNo = generateClientDO(branch, orderDate);
                document.getElementById('doNoInput').value = doNo;
            }

            const data = {
                doNo: doNo,
                branch: branch,
                orderDate: orderDate,
                pickupTime: pickupTime,
                orderedBy: document.getElementById('orderedBy').value,
                item1: quantities['item1'], item2: quantities['item2'], item3: quantities['item3'], item4: quantities['item4'],
                item5: 0, item6: 0, item7: 0,
                totalQty: totalQty,
                totalAmount: totalAmount.toFixed(2)
            };

            const historyItem = {
                doNo: doNo,
                branch: branch,
                orderDate: orderDate,
                pickupTime: pickupTime,
                item1: quantities['item1'], item2: quantities['item2'], item3: quantities['item3'], item4: quantities['item4'],
                totalQty: totalQty,
                totalAmount: totalAmount.toFixed(2),
                timestamp: new Date().getTime()
            };
            saveOrderToHistory(historyItem);

            const webAppUrl = "https://script.google.com/macros/s/AKfycbzuWq_jBKkT9_pQ08tK0jDypKo-7bgXiIetX1Lx61r6inQM2b30b04i6n1V9jSwW3kYvw/exec";

            fetch(webAppUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
            .then(() => {
                setTimeout(() => {
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    alert(action === 'update' ? "Order updated successfully!" : "Order submitted successfully!");
                    window.location.reload();
                }, 1500);
            }).catch(error => {
                console.error(error);
                document.getElementById('loadingOverlay').classList.add('hidden');
                alert("Network error. Please try again!");
            });
        }
    </script>
</body>
</html>
